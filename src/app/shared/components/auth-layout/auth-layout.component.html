<div class="min-h-screen flex">

      <!-- LEFT — image + overlay bleu -->
      <div class="hidden lg:flex flex-col justify-between w-[46%] relative overflow-hidden">
        <img src="/img/login.jpg" alt="" class="absolute inset-0 w-full h-full object-cover" />
        <div class="absolute inset-0"
          style="background:linear-gradient(150deg,rgba(30,58,138,0.90) 0%,rgba(37,99,235,0.78) 50%,rgba(6,182,212,0.45) 100%);">
        </div>

        <div class="relative z-10 flex flex-col justify-between h-full p-12">
          <!-- Logo -->
          <div class="flex items-center gap-3">
            <img src="/img/logo.jpg" alt="Logo" class="w-11 h-11 flex-shrink-0" style="border-radius:14px;" />
            <span class="font-display text-2xl text-white" style="letter-spacing:-0.01em;">Credential App</span>
          </div>

          <!-- Texte -->
          <div>
            <div class="inline-flex items-center gap-2 text-xs font-semibold px-4 py-1.5 rounded-full mb-6"
              style="background:rgba(6,182,212,0.25); color:#A5F3FC; border:1px solid rgba(6,182,212,0.4);">
              <i class="fa-solid fa-shield-halved"></i> Sécurisé & Chiffré
            </div>
            <h2 class="font-display text-white text-4xl leading-tight mb-4">{{ heading }}</h2>
            <p class="text-white/70 text-base leading-relaxed max-w-xs">{{ subheading }}</p>
          </div>

          <!-- Badges -->
          <div class="flex flex-wrap gap-2">
            
          </div>
        </div>
      </div>

      <!-- RIGHT — fond blanc pur -->
      <div class="flex-1 flex items-center justify-center overflow-y-auto p-8 bg-white">
        <div class="w-full max-w-md">

          <!-- Logo mobile -->
          <div class="flex items-center gap-3 mb-8 lg:hidden">
            <img src="/img/logo.jpg" alt="Logo" class="w-9 h-9 flex-shrink-0" style="border-radius:12px;" />
            <span class="font-extrabold text-lg" style="color:#0F172A;">Credential App</span>
          </div>

          <ng-content />
        </div>
      </div>

    </div>
